services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase-ferreteria:
    build: ./database
    profiles: [tooling]
    depends_on:
      mysql: { condition: service_healthy }
    working_dir: /workspace
    volumes: ["./database:/workspace"]
    entrypoint: ["liquibase", "--changeLogFile=changelog/db.changelog-master.yaml",
                 "--url=jdbc:mysql://mysql:3306/${MYSQL_DB}",
                 "--username=${MYSQL_USER}", "--password=${MYSQL_PASSWORD}"]

  backend:
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_TOKEN_SECRET: ${APP_TOKEN_SECRET}

volumes:
  mysql_data: